<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Loja Vermelha</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #000;
    color: #fff;
}

header {
    background-color: #b30000;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

nav {
    background-color: #111;
    padding: 10px;
    text-align: center;
}

nav a {
    color: #fff;
    margin: 0 15px;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: red;
}

.container {
    padding: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background-color: #111;
    border: 1px solid red;
    padding: 15px;
    text-align: center;
}

.product img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

button {
    background-color: red;
    border: none;
    padding: 10px;
    color: white;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
    font-size: 16px;
}

button:hover {
    background-color: darkred;
}

#cart {
    margin-top: 30px;
    border-top: 2px solid red;
    padding-top: 20px;
}

footer {
    background-color: #111;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Loja Vermelha 🔥</h1>
    <p>Os melhores produtos você encontra aqui</p>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#">Produtos</a>
    <a href="#">Contato</a>
</nav>

<div class="container">
    <h2>Produtos em Destaque</h2>

    <div class="products">
        <div class="product">
            <img src="https://via.placeholder.com/300x200">
            <h3>Camiseta Premium</h3>
            <p>R$ 79,90</p>
            <button onclick="addToCart('Camiseta Premium - R$79,90')">Adicionar ao carrinho</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200">
            <h3>Tênis Esportivo</h3>
            <p>R$ 199,90</p>
            <button onclick="addToCart('Tênis Esportivo - R$199,90')">Adicionar ao carrinho</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200">
            <h3>Relógio Moderno</h3>
            <p>R$ 149,90</p>
            <button onclick="addToCart('Relógio Moderno - R$149,90')">Adicionar ao carrinho</button>
        </div>
    </div>

    <div id="cart">
        <h2>🛒 Carrinho</h2>
        <ul id="cartItems"></ul>
    </div>
</div>

<footer>
    <p>© 2025 Loja Vermelha - Todos os direitos reservados</p>
</footer>

<script>
function addToCart(product) {
    const cart = document.getElementById("cartItems");
    const item = document.createElement("li");
    item.textContent = product;
    cart.appendChild(item);
}
</script>

</body>
</html>
